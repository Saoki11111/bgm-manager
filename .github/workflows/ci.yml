name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: ./macos/BGMManager/build.sh

      - name: Verify signature
        run: codesign --verify --deep --strict "dist/BGM Manager.app"
